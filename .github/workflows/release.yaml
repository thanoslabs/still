name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version to release (bare X.Y.Z, e.g. 1.2.3). Omit to derive the next version from PR labels."
        required: false
        type: string

# Needed to push the release tag and create the GitHub release.
permissions:
  contents: write

# Serialize releases so back-to-back merges to main don't race on tag creation.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0 # full history + existing tags are required to compute the next version

      - name: Compute next version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          # Manual release: explicit version (bare X.Y.Z, no 'v' prefix).
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            if [[ ! "${INPUT_VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version must be bare SemVer (X.Y.Z, no 'v' prefix), got '${INPUT_VERSION}'"
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/${INPUT_VERSION}" >/dev/null; then
              echo "::error::Tag '${INPUT_VERSION}' already exists"
              exit 1
            fi
            echo "version=${INPUT_VERSION}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          # Automatic release: bump level comes from the merged PR's labels.
          # 'major' takes precedence over 'minor'; anything else (or no PR) -> patch.
          BASE="$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          BASE="${BASE:-0.0.0}"

          LABELS="$(gh api --jq 'if length > 0 then [.[0].labels[].name] | join(",") else "" end' \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" 2>/dev/null || true)"

          # Exact label match within the comma-separated list (avoids false
          # positives from labels like 'pre-major' or 'semver-minor').
          LEVEL="patch"
          if [[ ",${LABELS}," == *",major,"* ]]; then
            LEVEL="major"
          elif [[ ",${LABELS}," == *",minor,"* ]]; then
            LEVEL="minor"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE}"
          case "${LEVEL}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
          esac

          echo "base=${BASE} labels=[${LABELS:-none}] bump=${LEVEL} version=${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Tag release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate signing configuration
        env:
          STILL_KEYSTORE_BASE64: ${{ secrets.STILL_KEYSTORE_BASE64 }}
          STILL_KEYSTORE_PASSWORD: ${{ secrets.STILL_KEYSTORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.STILL_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.STILL_KEY_PASSWORD }}
        run: |
          for name in STILL_KEYSTORE_BASE64 STILL_KEYSTORE_PASSWORD STILL_KEY_ALIAS STILL_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing $name; configure a persistent release signing key in repository secrets"
              exit 1
            fi
          done

      - name: Build signed release APK
        env:
          STILL_KEYSTORE_BASE64: ${{ secrets.STILL_KEYSTORE_BASE64 }}
          STILL_KEYSTORE_PASSWORD: ${{ secrets.STILL_KEYSTORE_PASSWORD }}
          STILL_KEY_ALIAS: ${{ secrets.STILL_KEY_ALIAS }}
          STILL_KEY_PASSWORD: ${{ secrets.STILL_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # GitHub run number grows for every release run, including manual releases.
          gradle --no-daemon :app:assembleRelease \
            -PstillVersionCode="${GITHUB_RUN_NUMBER}" \
            -PstillVersionName="${VERSION}"
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "${VERSION}" \
            --title "${VERSION}" \
            --generate-notes

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release upload "${VERSION}" app/build/outputs/apk/release/app-release.apk --clobber

